    <style>
      :root {
        --bg: #f5f8fc;
        --surface-1: #ffffff;
        --surface-2: #ffffff;
        --border: #e1e8f0;
        --border-strong: #185fa5;
        --text-primary: #0c2540;
        --text-secondary: #5b7088;
        --text-muted: #94a7bb;
        --text-success: #15803d;
        --text-warning: #b45309;
        --text-accent: #185fa5;
        --bg-success: #dcfce7;
        --fill-success: #15803d;
        --bg-warning: #fef3c7;
        --text-danger: #b91c1c;
        --bg-danger: #fee2e2;
        --bg-accent: #e6f1fb;
        --fill-accent: #185fa5;
        --fill-warning: #f59e0b;
        --on-accent: #ffffff;
        --radius: 10px;
        --radius-lg: 14px;
        --shadow-sm: 0 4px 12px rgba(12, 37, 64, 0.08);
        --shadow-md: 0 8px 24px rgba(12, 37, 64, 0.18);
      }
      [data-theme="dark"] {
        --bg: #0f1720;
        --surface-1: #1a2532;
        --surface-2: #1e2a38;
        --border: #2d3b4a;
        --border-strong: #4a90d9;
        --text-primary: #e8edf2;
        --text-secondary: #9fb0c0;
        --text-muted: #6b7f92;
        --text-success: #4ade80;
        --text-warning: #fbbf24;
        --text-accent: #6ba9dd;
        --bg-success: #14532d;
        --fill-success: #22c55e;
        --bg-warning: #451a03;
        --text-danger: #f87171;
        --bg-danger: #4c0d0d;
        --bg-accent: #1e3a5f;
        --fill-accent: #4a90d9;
        --fill-warning: #f59e0b;
        --on-accent: #ffffff;
        --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.35);
        --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.5);
      }
      * { box-sizing: border-box; }
      @keyframes app-loading-spin { to { transform: rotate(360deg); } }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text-primary);
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      button {
        font-family: inherit;
        font-size: 14px;
        padding: 8px 14px;
        border-radius: var(--radius);
        border: 0.5px solid var(--border);
        background: var(--surface-1);
        color: var(--text-primary);
        cursor: pointer;
        box-shadow: var(--shadow-sm);
        transition: filter 0.12s ease, opacity 0.12s ease;
      }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      /* Butonların kendi inline background/border'ı olsa bile (ör. dolgulu
         accent butonlar) filter tıklama/hover geri bildirimini bozmadan üstüne
         biner — hiçbir yerde önceden hover/active durumu yoktu. */
      button:hover:not(:disabled) { filter: brightness(0.96); }
      button:active:not(:disabled) { filter: brightness(0.9); }
      input, select, textarea {
        font-family: inherit;
        font-size: 14px;
        padding: 8px 10px;
        border-radius: var(--radius);
        border: 0.5px solid var(--border);
        background: var(--surface-1);
        color: var(--text-primary);
        transition: border-color 0.12s ease, box-shadow 0.12s ease;
      }
      input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: var(--border-strong);
        box-shadow: 0 0 0 3px var(--bg-accent);
      }
      input:disabled, select:disabled, textarea:disabled { opacity: 0.5; cursor: not-allowed; }
      input::placeholder, textarea::placeholder { color: var(--text-muted); opacity: 1; }
      input[type="checkbox"], input[type="radio"] {
        width: auto;
        padding: 0;
        accent-color: var(--fill-accent);
      }
      /* #root'a genişlik sınırı KONULMUYOR — landing page/portal/yasal sayfalar/
         yönetici sayfası tam genişlik olmalı. Sadece giriş sonrası panel (App.jsx
         Dashboard) kendi wrapper'ında max-width:980px kullanıyor. */
      .sr-only {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
      }
      .info-tip { position: relative; display: inline-flex; align-items: center; }
      /* Balon artık InfoTip.jsx tarafından document.body'ye portal'lanıyor
         (bkz. shared.jsx InfoTip yorumu) — bu yüzden position:fixed ve
         top/left/transform React'ten inline style olarak geliyor, burada
         sadece GÖRSEL stil kalıyor. Bu sayede bir modal/kart gibi overflow:
         hidden/auto olan HİÇBİR üst öğe artık balonu kırpamıyor.
         z-index:2000, Modal'ın kendi z-index:1000'inin üstünde olacak şekilde
         bilerek yüksek tutuldu. */
      .info-tip-bubble--portal {
        position: fixed;
        background: #0c2540;
        color: #fff;
        font-size: 12px;
        font-weight: 400;
        line-height: 1.4;
        padding: 10px 12px;
        border-radius: 8px;
        width: max-content;
        max-width: 280px;
        z-index: 2000;
        pointer-events: none;
        text-transform: none;
        letter-spacing: normal;
        white-space: pre-line;
        text-align: left;
      }
      /* Sol menüdeki sekme butonları seçili değilken background:transparent
         inline stille geliyor — genel button:hover filter'ı koyulaştıracak bir
         renk bulamadığı için görünmüyordu. Kendi hover rengi gerekiyor. */
      .app-sidebar-tab:hover {
        background: var(--surface-1) !important;
      }
      @media print {
        body * { visibility: hidden; }
        #teklif-print, #teklif-print * { visibility: visible; }
        #teklif-print { position: absolute; top: 0; left: 0; width: 100%; }
        .no-print { display: none !important; }
        @page { size: A4; margin: 16mm; }
      }
      /* Dar ekranlarda navbar'daki ikincil linkler (Hizmetlerimiz/Hakkımızda) taşıp
         kayboluyordu — dar ekranda gizlenir, ilgili bölümlere sayfa kaydırarak zaten ulaşılabilir. */
      @media (max-width: 640px) {
        /* .landing-nav-links elementi ayrıca inline style={{display:"flex"}}
           de taşıyor — !important olmadan bu kural hiç etkili olmuyordu,
           menü her genişlikte görünür kalıp logonun yanına sıkışıyordu. */
        .landing-nav-links { display: none !important; }
      }
      /* Orta linkler 640px altında zaten gizleniyor ama "Giriş Yap" +
         "Ücretsiz Kullan" butonları hiç küçülmüyordu — dar telefonlarda
         (~360-390px) logo+iki buton genişliği kullanılabilir alanı aşıp
         navbar sıkışık/taşmış görünüyordu. */
      @media (max-width: 420px) {
        .landing-navbar { padding: 0 12px !important; }
        .landing-nav-actions { gap: 6px !important; }
        .landing-nav-login { padding: 8px 6px !important; font-size: 12.5px !important; }
        .landing-nav-cta { padding: 8px 10px !important; font-size: 12.5px !important; }
      }
      /* Hero mockup'ındaki 4 sütunlu istatistik ızgarası dar telefonlarda
         (~360px) her hücreye çok az yer bırakıp "₺940.000" gibi değerleri
         sıkıştırıyordu — 2x2'ye düşer. */
      @media (max-width: 480px) {
        .landing-hero-stats { grid-template-columns: 1fr 1fr !important; }
      }
      /* Ana uygulamanın sol sekme menüsü (Pano/Müşteriler/... ) masaüstünde sabit
         200px'lik bir sidebar — telefon genişliğinde (ve özellikle kurulu PWA'da,
         tarayıcı çubuğu olmadığı için alan daha da dar) içerikle sıkışıp taşıyordu.
         Dar ekranda soldan açılan bir çekmeceye dönüşür, hamburger butonuyla açılır. */
      /* IconButton kendi display:flex'ini inline style olarak set ediyor, class
         kuralları normalde onu ezemez — bu yüzden burada da !important gerekiyor. */
      .app-sidebar-toggle { display: none !important; }
      @media (max-width: 860px) {
        .app-sidebar-toggle { display: flex !important; }
        .app-sidebar {
          /* nav'ın inline style'ındaki position:sticky/top:24'ü ezmek için
             !important gerekiyor — inline style aksi halde class'ı kazanır. */
          position: fixed !important;
          top: 0 !important;
          left: 0;
          height: 100vh;
          z-index: 300;
          background: var(--surface-1);
          border-right: 0.5px solid var(--border);
          padding: 16px 12px;
          overflow-y: auto;
          transform: translateX(-100%);
          transition: transform 0.2s ease;
        }
        .app-sidebar.open { transform: translateX(0); }
        .app-sidebar-backdrop {
          position: fixed;
          inset: 0;
          background: rgba(12, 37, 64, 0.4);
          z-index: 290;
        }
      }
      /* Bildirim zili paneli sabit 320px genişlikte ve zil ikonunun sağ kenarına
         hizalı açılıyor — zil ikonu sağdaki ayarlar/çıkış ikonlarının solunda
         durduğu için dar telefon ekranlarında panel sol kenardan taşıyordu.
         Dar ekranda tam genişlik, üstte sabit bir panele dönüşür. */
      @media (max-width: 600px) {
        .notif-dropdown {
          position: fixed !important;
          top: 70px !important;
          left: 12px !important;
          right: 12px !important;
          width: auto !important;
          max-height: calc(100vh - 90px) !important;
        }
      }
      /* Modal'ın sabit 1rem/1.5rem padding'i dar telefon ekranında (ör. 375px)
         içerik alanından ~110px'i tek başına yiyordu — her form/dialog gereksiz
         dar görünüyordu. Dar ekranda padding daraltılır, genişlik korunur. */
      @media (max-width: 420px) {
        .modal-overlay { padding: 0.5rem !important; }
        .modal-card { padding: 1rem !important; }
      }
      /* Mesajlar sekmesi sabit "300px liste + esnek konuşma" grid'i dar ekranda
         neredeyse tüm genişliği listeye ayırıp konuşmayı sıkıştırıyordu. Dar
         ekranda tipik mesajlaşma uygulaması gibi tek seferde ya liste ya da
         seçili konuşma gösterilir, "Konuşmalara dön" ile geri dönülür. */
      @media (max-width: 760px) {
        .messages-grid { grid-template-columns: 1fr !important; }
        .messages-grid[data-has-selection="true"] .msg-list-pane { display: none; }
        .messages-grid[data-has-selection="false"] .msg-thread-pane { display: none; }
        .messages-grid[data-has-selection="true"] .msg-back-button { display: flex !important; }
      }
      /* PDF şablon editörü 3 sabit genişlikli panelden oluşuyor (sol 150px
         blok paleti + orta canvas + sağ 280px özellik paneli) — ikisi toplam
         430px, telefon ekranının çoğunu/tamamını yiyip canvas'ı erişilemez
         bırakıyordu. Dar ekranda ikisi de varsayılan kapalı, üstteki
         "Bloklar"/"Özellikler" butonlarıyla açılan soldan/sağdan çekmecelere
         dönüşüyor (aynı breakpoint'i kullandığından .app-sidebar-backdrop
         burada da paylaşılıyor). */
      .pdf-panel-toggle { display: none; }
      @media (max-width: 860px) {
        .pdf-panel-toggle { display: inline-block; }
        .pdf-block-panel, .pdf-inspector-panel {
          position: fixed;
          top: 0;
          height: 100vh;
          z-index: 300;
          transition: transform 0.2s ease;
        }
        .pdf-block-panel { left: 0; transform: translateX(-100%); }
        .pdf-block-panel.open { transform: translateX(0); }
        .pdf-inspector-panel { right: 0; transform: translateX(100%); }
        .pdf-inspector-panel.open { transform: translateX(0); }
      }
      /* Ajanda'nın 7 sütunlu ay görünümü dar ekranda ~46px genişliğindeki
         hücrelere sabit 72px min-height uyguluyordu — boş günler bile
         gereksiz yere uzun, dar/"ölçüsüz" dikdörtgenler gibi görünüyordu.
         Dar ekranda min-height küçültülüp hücreler kareye yakın, daha
         doğal oranlı görünür; olayı olan günler zaten flex içerik ile
         gerektiği kadar uzuyor. */
      @media (max-width: 480px) {
        .agenda-grid { gap: 2px !important; }
        .agenda-day-cell--ay { min-height: 44px !important; padding: 3px 4px !important; }
        .agenda-day-number { font-size: 11px !important; }
        .agenda-event-pill { font-size: 9px !important; padding: 0 3px !important; }
      }
      /* Teklif/Randevu/Üyelik/Rezervasyon formu — 36-40px input yüksekliği,
         14px yazı; textarea hariç (o kendi min-height'ını kullanır). Sadece
         bu forma özel, başka hiçbir yeri etkilemez. */
      .compact-form input:not([type="checkbox"]):not([type="radio"]),
      .compact-form select {
        height: 38px;
        padding: 0 10px;
        font-size: 14px;
      }
      .compact-form textarea {
        padding: 8px 10px;
        font-size: 14px;
      }
      /* Uygulama içi üst başlık çubuğu (logo, şirket adı, bildirim/ayarlar/çıkış)
         sabit tek satır flex idi — dar telefon ekranında sağdaki ikon kümesi
         (özellikle "Çıkış" metniyle) viewport'un sağından taşıyordu. Dar
         ekranda satır kırılır (ikonlar alta düşer, hiçbir şey kaybolmaz),
         "Çıkış" ayrıca ikon-only'e döner. */
      @media (max-width: 480px) {
        .app-header-row { flex-wrap: wrap !important; row-gap: 8px; }
        .app-header-logout-btn span { display: none !important; }
      }
      /* Müşteriler/Randevular gibi liste ekranlarındaki tablolar dar ekranda
         yatay kaydırmaya zorluyordu (sütunlar sığmıyordu). CSS-only "responsive
         table" deseni: satır bloğa döner (kart gibi), her hücre kendi
         data-label'ını başlık olarak gösterir — <thead> gizlenir. <tr> zaten
         inline background taşıdığı için kart görünümü ek renk gerektirmiyor,
         sadece hücrelerin satır-içi köşe-yuvarlatması (masaüstünde ilk/son
         hücreye özel) sıfırlanıp yuvarlatma satırın kendisine taşınıyor. */
      @media (max-width: 640px) {
        .responsive-table thead { display: none !important; }
        .responsive-table tr { display: block !important; border-radius: var(--radius-lg) !important; margin-bottom: 8px; box-shadow: var(--shadow-sm); }
        .responsive-table td { display: block !important; border-radius: 0 !important; padding: 4px 12px !important; text-align: left !important; white-space: normal !important; }
        .responsive-table td::before { content: attr(data-label); display: block; font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.3px; margin-top: 4px; }
        .responsive-table td:empty { display: none !important; }
        .responsive-table td:first-child { padding-top: 10px !important; }
        .responsive-table td:last-child { padding-bottom: 10px !important; }
        /* Son sütundaki aksiyon butonları (Düzenle/Sil/3 nokta menüsü) masaüstünde
           sağa yaslanıyordu (justifyContent: flex-end) - td artık tam genişlikte
           bir kart satırı olduğu için bu, butonları kartın sağ ucuna itip diğer
           tüm içerikle (soldan başlayan) tutarsız/uzak duruyordu. Mobilde sola çeker. */
        .responsive-table td:last-child > div { justify-content: flex-start !important; }
      }
      /* Liste ekranlarındaki buton/filtre satırları (Dışa aktar, İçe aktar,
         Kurumsal/Bireysel, Liste/Kanban vb.) sınırsız flex-wrap ile her biri
         neredeyse tam genişlikte alt alta diziliyor, gerçek veriye ulaşmadan
         önce uzun bir kaydırma gerektiriyordu. Dar ekranda butonlar küçülüp
         birden fazlası aynı satıra sığar. */
      @media (max-width: 640px) {
        /* flex-wrap her zaman zorlanıyor — bazı buton grupları (ör. Destek'in
           dışa/içe aktar satırı) kendi flexWrap'ini üst container'a bırakıyor,
           kendisi sarmıyordu; !important bu durumda da güvenli, zaten wrap
           olan satırlarda hiçbir şeyi değiştirmiyor. */
        .list-toolbar { gap: 6px !important; flex-wrap: wrap !important; }
        .list-toolbar > button, .list-toolbar > select { flex: 1 1 auto !important; min-width: 0; font-size: 12px !important; padding: 6px 10px !important; }
      }
      /* Finans → Gelir-Gider Defteri "2fr 1fr" grid'i (ana defter + kategori
         özeti) dar ekranda ikisini de sıkıştırıyordu, kategori sütunu
         okunaksız hale geliyordu. Dar ekranda tek sütuna düşer. */
      @media (max-width: 760px) {
        .finance-ledger-grid { grid-template-columns: 1fr !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
