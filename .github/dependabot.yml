version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Majör surum siçramalari (React 19, Vite 8 gibi) genelde kirilma
      # riski tasir ve otomatik PR olarak degil, bilincli/test edilmis bir
      # karar olarak yapilmali - App.jsx bolme/TypeScript gecisi gibi.
      # Patch/minor guncellemeler (guvenlik yamalari dahil) normal akar,
      # sadece "x.0.0 -> y.0.0" tarzi buyuk atlamalar onerilmiyor. Elle
      # majör surume gecmek istersen bu kural hicbir sekilde engel olmaz.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
