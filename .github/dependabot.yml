version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # react/react-dom majör surumu ayri ayri PR'larda onerildigi icin
      # birbirleriyle celisip build'i kiriyor (react-dom 19.x, react'in hala
      # 18.x olmasini istemiyor). Kasitli bir React 19 gecisi yapilmadan
      # majör atlama onerilmesin, patch/minor guncellemeler gelmeye devam etsin.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
